<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Earthy Blooms Florist</title>
    <meta name="description" content="Seasonal flower arrangements hand-arranged by Kenzie Hayes." />
    <meta name="theme-color" content="#245232" />
    <link rel="icon" type="image/png" href="/brand/logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gilda+Display&family=Montserrat:wght@400;500;600&display=swap" />
  </head>
  <body>
    <!-- Netlify Forms detection: keep these fields in sync with OrderForm.jsx -->
    <form name="custom-order" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input name="bot-field" />
      <input name="name" />
      <input name="phone" />
      <input name="email" />
      <input name="product" />
      <input name="occasion" />
      <input name="date" />
      <input name="budget" />
      <textarea name="notes"></textarea>
    </form>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
